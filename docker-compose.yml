# ============================================================================
# Docker Compose para desarrollo local
# Levanta PostgreSQL con la base de datos del sistema.
# ============================================================================
# Uso:
#   docker-compose up -d          → Levantar servicios
#   docker-compose down           → Detener servicios
#   docker-compose down -v        → Detener y eliminar volúmenes (reset BD)
# ============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: emprendedores-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emprendedores_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
