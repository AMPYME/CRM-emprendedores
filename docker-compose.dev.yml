services:
  postgres:
    image: postgres:16-alpine
    container_name: emprendedores-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emprendedores_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: emprendedores-backend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns_search:
      - ampyme.local
    environment:
      # Sobrescribe .env si hace falta; DATABASE_URL debe usar host postgres en la red compose
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emprendedores_db?schema=public
      WS_PATH: /ws/intake
      INTAKE_SESSION_TTL_MIN: '20'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
    command: sh scripts/dev-entrypoint.sh
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - '4000:4000'

  frontend:
    image: node:20-alpine
    container_name: emprendedores-frontend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws/intake
      NEXT_PUBLIC_INTAKE_FORM_URL: http://localhost:3000/emprendedores/
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '3000:3000'

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
