# CRM Emprendedores — desarrollo (Postgres + API + Next).
# Desde esta carpeta:
#   docker compose -f docker-compose.dev.yml up --build
#
# UI:  http://localhost:3000
# API: http://localhost:4000/api/v1
#
# El código se monta y se recarga solo. Forms (MySQL), Entra y SIEP siguen
# fuera de este compose: el backend los alcanza por las variables de .env
# (Entra y SIEP vía host.docker.internal).

services:
  postgres:
    image: postgres:16-alpine
    container_name: emprendedores-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emprendedores_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: emprendedores-backend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Sobrescribe .env si hace falta; DATABASE_URL debe usar host postgres en la red compose
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emprendedores_db?schema=public
      WS_PATH: /ws/intake
      INTAKE_SESSION_TTL_MIN: '20'
      FORMS_MYSQL_HOST: 192.168.2.184
      FORMS_MYSQL_PORT: '3306'
      FORMS_MYSQL_DATABASE: forms_ampyme
      ENTRA_API_BASE_URL: http://host.docker.internal:8080
      EMPRENDEDORES_CLIENT_ID: c1af0f4e-6b8c-425a-be11-8789e86a82a4
      EMPRENDEDORES_APP_SECRET: emprendedoresdevsecret
      SIEP_API_URL: http://host.docker.internal:4100/api/v1
      SIEP_CLIENT_ID: crm-emprendedores
      SIEP_CLIENT_SECRET: crm-emprendedores-dev-secret
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
    command: sh scripts/dev-entrypoint.sh
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: emprendedores-frontend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # El navegador llama a /backend-api en el mismo origen.
      # El rewrite de Next corre DENTRO de este contenedor: localhost:4000 no es el API.
      API_PROXY_TARGET: http://backend:4000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws/intake
      NEXT_PUBLIC_INTAKE_FORM_URL: http://localhost:3000/emprendedores/
      NEXT_PUBLIC_ENTRA_API_URL: http://localhost:8080
      NEXT_PUBLIC_EMPRENDEDORES_CLIENT_ID: c1af0f4e-6b8c-425a-be11-8789e86a82a4
      NEXT_PUBLIC_EMPRENDEDORES_RETURN_URL: http://localhost:3000/login
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
      PORT: '3000'
    command: sh scripts/dev-entrypoint.sh
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    # journald a veces oculta stdout de npm/next; json-file facilita `podman logs`
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
