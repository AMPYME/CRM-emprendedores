services:
  postgres:
    image: postgres:16-alpine
    container_name: emprendedores-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emprendedores_db
    ports:
      # Solo esta máquina. El frontend y el backend sí quedan en la LAN.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: emprendedores-backend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns_search:
      - ampyme.local
    environment:
      # Sobrescribe .env si hace falta; DATABASE_URL debe usar host postgres en la red compose
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emprendedores_db?schema=public
      WS_PATH: /ws/intake
      INTAKE_SESSION_TTL_MIN: '20'
      FORMS_MYSQL_HOST: 192.168.2.184
      FORMS_MYSQL_PORT: '3306'
      FORMS_MYSQL_DATABASE: forms_ampyme
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
      # El .env fija solo localhost. En dev se acepta cualquier origen de la LAN.
      CORS_ORIGIN: '*'
    command: sh scripts/dev-entrypoint.sh
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      # 4000: acceso directo en WSL. 8000: portproxy de Windows (192.168.2.112:8000 → WSL:8000).
      - '0.0.0.0:4000:4000'
      - '0.0.0.0:8000:4000'

  frontend:
    image: node:20-alpine
    container_name: emprendedores-frontend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      # SSR dentro de Docker habla con el servicio backend (nombre de red).
      # El navegador entra por el puerto 80 y llama al API en el 8000 del mismo host.
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
      API_PROXY_TARGET: http://backend:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://backend:4000/ws/intake
      NEXT_PUBLIC_LAN_API_PORT: '8000'
      NEXT_PUBLIC_DIRECT_API_PORT: '4000'
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      # El host publica el frontend en el puerto 80. Next sigue escuchando en el 3000 del contenedor.
      - '0.0.0.0:80:3000'

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
